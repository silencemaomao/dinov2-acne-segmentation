[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acne-dinov2"
version = "0.2.0"
description = "DINOv2 multi-class facial heatmap segmentation with Hugging Face Accelerate"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.1,<2",
  "numpy>=1.26,<3",
  "Pillow>=10,<12",
  "PyYAML>=6,<7",
  "torch>=2.2",
  "transformers>=4.45,<5",
]

[tool.setuptools.packages.find]
include = ["acne_dinov2*"]
